<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Sajjad Fatehi — Software Engineer, real-time systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a1a"/>
      <stop offset="1" stop-color="#1a0e33"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f7b32b"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".15" cy=".75" r=".45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".85" cy=".75" r=".45">
      <stop offset="0" stop-color="#f7b32b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f7b32b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="300" rx="18"/></clipPath>
    <path id="wire" d="M136 228 C 330 180, 570 276, 764 228"/>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .dim { fill: #8b93b8; }
    .fade { animation: fadeUp .9s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .9s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
    .live { animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 50% { opacity: .15; } }
    .flow { stroke-dasharray: 3 14; animation: flow .9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -34; } }
    .sun { transform-origin: 842px 44px; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ice1 { opacity: 0; animation: ice1 3.6s both; }
    .ice2 { opacity: 0; animation: ice2 3.6s both; }
    .ice3 { animation: ice3 3.6s both; }
    @keyframes ice1 { 0%, 33% { opacity: 1; } 34%, 100% { opacity: 0; } }
    @keyframes ice2 { 0%, 33% { opacity: 0; } 34%, 66% { opacity: 1; } 67%, 100% { opacity: 0; } }
    @keyframes ice3 { 0%, 66% { opacity: 0; } 67%, 100% { opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect width="900" height="300" fill="url(#grid)"/>
    <rect width="900" height="300" fill="url(#glowA)"/>
    <rect width="900" height="300" fill="url(#glowB)"/>

    <g class="fade d1">
      <circle class="live" cx="44" cy="40" r="5" fill="#ef4444"/>
      <text class="mono" x="58" y="45" font-size="13" font-weight="700" fill="#fca5a5" letter-spacing="1.5">LIVE</text>
      <text class="mono dim" x="104" y="45" font-size="13">session://github.com/sajjad-fatehi</text>
    </g>

    <g class="sun">
      <circle cx="842" cy="44" r="11" fill="#f7b32b"/>
      <g stroke="#f7b32b" stroke-width="2.5" stroke-linecap="round">
        <path d="M842 22v-6M842 66v6M820 44h-6M864 44h6M826.4 28.4l-4.2-4.2M857.6 59.6l4.2 4.2M826.4 59.6l-4.2 4.2M857.6 28.4l4.2-4.2"/>
      </g>
    </g>

    <text class="sans fade d2" x="450" y="122" text-anchor="middle" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#titleFill)">Sajjad Fatehi</text>
    <text class="mono fade d3" x="450" y="158" text-anchor="middle" font-size="16" fill="#a5b4fc">software engineer · real-time systems · AI builder · perf nerd</text>

    <g class="fade d4">
      <use href="#wire" fill="none" stroke="url(#beam)" stroke-opacity=".18" stroke-width="10"/>
      <use href="#wire" class="flow" fill="none" stroke="url(#beam)" stroke-width="2" stroke-linecap="round"/>

      <circle r="4" fill="#22d3ee">
        <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#wire"/></animateMotion>
      </circle>
      <circle r="4" fill="#22d3ee" opacity=".6">
        <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#wire"/></animateMotion>
      </circle>
      <circle r="4" fill="#f7b32b">
        <animateMotion dur="2.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#wire"/></animateMotion>
      </circle>

      <text class="mono" x="450" y="206" text-anchor="middle" font-size="12" letter-spacing="1">
        <tspan class="ice1" fill="#8b93b8">ICE: gathering candidates…</tspan>
      </text>
      <text class="mono" x="450" y="206" text-anchor="middle" font-size="12" letter-spacing="1">
        <tspan class="ice2" fill="#fcd34d">ICE: checking…</tspan>
      </text>
      <text class="mono" x="450" y="206" text-anchor="middle" font-size="12" letter-spacing="1">
        <tspan class="ice3" fill="#4ade80">ICE: connected ✓  (let's build something)</tspan>
      </text>

      <circle cx="110" cy="228" r="26" fill="none" stroke="#22d3ee">
        <animate attributeName="r" values="26;44" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".6;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="228" r="26" fill="#0d1530" stroke="#22d3ee" stroke-width="2"/>
      <text class="mono" x="110" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#a5f3fc">you</text>

      <circle cx="790" cy="228" r="26" fill="none" stroke="#f7b32b">
        <animate attributeName="r" values="26;44" dur="2s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".6;0" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="228" r="26" fill="#1f1530" stroke="#f7b32b" stroke-width="2"/>
      <text class="mono" x="790" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#fde68a">sajjad</text>

      <text class="mono dim" x="450" y="284" text-anchor="middle" font-size="12" letter-spacing=".5">rtt 12ms · jitter 0.3ms · packet loss 0% · 60fps · codec: caffeine/v8</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="899" height="299" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
