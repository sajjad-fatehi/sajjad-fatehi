<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="Q · Event Loop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#231c30"/><stop offset="1" stop-color="#15111d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3048"/><stop offset="1" stop-color="#5a4a70"/></linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Consolas, monospace; }
    .ring { animation: ring 2.4s ease-in-out infinite; }
    @keyframes ring { 0%, 100% { stroke-opacity: .45; } 50% { stroke-opacity: 1; } }
    .neuron { animation: fire 1.8s ease-in-out infinite; }
    .n2 { animation-delay: .3s; } .n3 { animation-delay: .6s; }
    @keyframes fire { 0%, 100% { opacity: .45; } 40% { opacity: 1; } }
  </style>
  <rect x="4" y="4" width="72" height="72" rx="10" fill="url(#bg)"/>
  <rect class="ring" x="3" y="3" width="74" height="74" rx="11" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <text class="mono" x="40" y="54" text-anchor="middle" font-size="32" fill="#6cc24a">⟳</text>
  <rect x="8" y="8" width="18" height="18" rx="4" fill="#07050c"/>
  <text class="mono" x="17" y="21.5" text-anchor="middle" font-size="12" font-weight="700" fill="#f5efe0">Q</text>
</svg>
