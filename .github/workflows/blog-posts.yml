name: Latest blog posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://medium.com/feed/@sajjadfatehy"
          max_post_count: 5
          template: "- 📝 [$title]($url) <sub>· $date</sub>$newline"
          date_format: "mmm d, yyyy"
