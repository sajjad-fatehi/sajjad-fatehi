name: Profile stats cards

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/stats.mjs", ".github/workflows/profile-stats.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate stats cards
        run: node .github/scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git diff --cached --quiet || git commit -m "chore: update stats cards"
          git push
